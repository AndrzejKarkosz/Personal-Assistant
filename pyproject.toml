[project]
name = "alfred-brain"
version = "0.1.0"
description = "Alfred - a voice-first personal assistant brain (Jev routing, Claude execution, OKF session memory)."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "apscheduler>=3.10,<4",
    "mcp>=1.9",
    "python-multipart>=0.0.9",
    "claude-agent-sdk>=0.2.159",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
alfred = "brain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
