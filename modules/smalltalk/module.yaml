id: smalltalk
label: Conversation and quick answers
description: Greetings, thanks, jokes, opinions and quick trivia that needs no tools. Not for subjects the user is
  learning or keeps notes on (languages, courses, tech topics) - those go to the knowledge library.
examples:
  - cześć Alfred, jak się masz?
  - dzięki, to wszystko
  - ile to jest 15% z 240?
  - tell me something interesting
capabilities:
  chat:
    label: Talk without tools
    description: Conversation, general knowledge and quick reasoning - no tools needed.
    tools: []
    examples: ["cześć", "dzięki", "ile to 15% z 240?"]
effort: low
enabled: true
