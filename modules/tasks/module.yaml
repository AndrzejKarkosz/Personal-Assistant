id: tasks
label: Tasks, reminders and follow-ups
description: Remember to do something, remind me later, recurring routines, what is still open, mark something
  done, what did we agree to pick up.
examples:
  - przypomnij mi jutro o 9 żeby zadzwonić do mamy
  - co mam jeszcze otwarte?
  - every weekday at 8 give me a morning brief
  - oznacz fakturę jako zrobioną
capabilities:
  manage:
    label: Manage tasks and reminders
    description: Create a task or reminder (one-off due time or recurring cron), list open tasks, change status, add notes.
    tools: [task_create, task_update, task_list]
    examples: ["przypomnij mi za godzinę", "co mam otwarte?", "oznacz jako zrobione"]
  routines:
    label: Manage routines
    description: Create, change or remove Alfred's routines - prompts he runs by himself on a schedule (cron) or
      when the app starts (@start).
    tools: [routine_save, routine_delete]
    examples: ["dodaj rutynę: w dni robocze o 7:30 poranny brief", "przesuń rutynę na 8:00", "usuń rutynę powitanie"]
    confirm: true
uses: [memory.recall]
enabled: true
