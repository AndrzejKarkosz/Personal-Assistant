assistant:
  name: Alfred
  user_name: Andrzej
  address: { pl: "szefie", en: "boss" }
  default_language: pl
  reply_language: pl          # Alfred always answers in this language; empty = the language you spoke
  # Searched as context on every request, whatever module the router picks (plus routines in the prompt).
  context_capabilities: [knowledge.search, memory.recall, tasks.manage]
  timezone: Europe/Warsaw
  # brak zapytań przez after_minutes -> Alfred wita się przed odpowiedzią (TTS, bez LLM)
  welcome_back: { after_minutes: 120, pl: "Witaj z powrotem, szefie.", en: "Welcome back, boss." }

map:
  dir: brain_map
  topic_sources:
    - { server: knowledge-base, capability: knowledge.search, path: "E:/Knowledge-Base/wiki/topics" }

models:
  executor: claude-opus-5-5         # every module (a module.yaml may override with model: / effort:)
  executor_effort: medium
  light: claude-haiku-4-5
  max_tool_rounds: 8

router:
  jev_model: jev-latest
  jev_url: https://api.typesafe.ai/v1/systemone
  timeout_s: 4.0
  confident_at: 0.6
  ask_below: 0.3
  capability_coverage: 0.8
  injection_at: 0.5
  # Deterministic flows: a capability whose pattern appears in the request is ALWAYS given (with its module's
  # instructions), whatever Jev guessed. Regex, case-insensitive; \b = start of a word.
  triggers:
    tasks.manage: '\b(zadani|task|przypom|remind|to-?do)'
    tasks.routines: '\b(rutyn|routine)'
    calendar.read: '\b(kalendarz|calendar|spotkani|wydarzeni)'
    calendar.write: '\b(kalendarz|calendar|spotkani|wydarzeni)'
    knowledge.search: '\b(wiedz[aąeęy]\b|baz[aąeęy] wiedzy|notat|knowledge)'

voice:
  tts_enabled: true        # false -> Alfred answers without ElevenLabs (browser voice); listening (STT) unaffected
  stt_model: scribe_v2
  tts_model: eleven_flash_v2_5     # fast; eleven_multilingual_v2 = slower but more natural
  output_format: mp3_44100_128
  settings:
    speed: 1.1

memory:
  dir: data/memory
  session_idle_minutes: 15
  recall_sessions: 3

proactive:
  enabled: true
  heartbeat_minutes: 30
  quiet_hours: ["23:00", "07:00"]
  routines: config/routines.yaml

logging:
  dir: data/logs

mcp_config: config/mcp.json
