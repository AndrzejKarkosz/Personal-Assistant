assistant:
  name: Alfred
  user_name: Andrzej
  address: { pl: "szefie", en: "boss" }
  default_language: pl
  reply_language: pl          # Alfred always answers in this language; empty = the language you spoke
  # Searched as context on every request, whatever module the router picks (plus routines in the prompt).
  context_capabilities: [knowledge.search, memory.recall, tasks.manage]
  timezone: Europe/Warsaw
  # brak zapytań przez after_minutes -> Alfred wita się przed odpowiedzią (TTS, bez LLM)
  welcome_back: { after_minutes: 120, pl: "Witaj z powrotem, szefie.", en: "Welcome back, boss." }

tasks:
  # The ONLY task categories (the text tells Jev when the user picked one). Alfred cannot invent one: a new
  # category only through task_category_add, which asks you first - or add it yourself in Ustawienia.
  categories:
    SmartMeet: "Zadanie dotyczy SmartMeet (projekt, klient, kod, materiały SmartMeet) albo użytkownik mówi, że to do SmartMeet"
    Praca: "Zadanie zawodowe, ale nie SmartMeet: druga praca, faktury, rekrutacje, sprawy firmowe"
    Reszta: "Wszystko poza pracą: sprawy prywatne, zdrowie, sport, dom, zakupy, urzędy, nauka dla siebie"

map:
  dir: brain_map
  topic_sources:
    - { server: knowledge-base, capability: knowledge.search, path: "E:/Knowledge-Base/wiki/topics" }

models:
  executor: claude-opus-5-5         # every module (a module.yaml may override with model: / effort:)
  executor_effort: medium
  light: claude-haiku-4-5
  max_tool_rounds: 8

router:
  jev_model: jev-latest
  jev_url: https://api.typesafe.ai/v1/systemone
  timeout_s: 4.0
  confident_at: 0.6
  tool_at: 0.8          # a tool Jev scores this sure brings its capability + module, even if the capability guess missed
  ask_below: 0.3
  capability_coverage: 0.8
  injection_at: 0.5
  # Deterministic flows: a capability whose pattern appears in the request is ALWAYS given (with its module's
  # instructions), whatever Jev guessed. Regex, case-insensitive; \b = start of a word.
  triggers:
    tasks.manage: '\b(zadani|task|przypom|remind|to-?do)'
    tasks.routines: '\b(rutyn|routine)'
    calendar.read: '\b(kalendarz|calendar|spotkani|wydarzeni)'
    calendar.write: '\b(kalendarz|calendar|spotkani|wydarzeni)'
    knowledge.search: '\b(wiedz[aąeęy]\b|baz[aąeęy] wiedzy|notat|knowledge)'
    training.status: '\b(trening|strav|triathlon|ironman|pływ|basen|rower|bieg|biega|przebieg|brick|tape?r)'
    weight.log: '\b(zjadł|jadł|zjem|posiłek|posiłk|śniadani|obiad|kolacj|przekąsk|waż[eę]|waga|wagę|obw[oó]d)'
    weight.read: '\b(kalori|kcal|białk|makro|diet|redukcj|schudn|waga|wagi)'
    weight.goals: '\b(cel wagowy|cel wagi|celu wagowego|docelow)'
    training.steps: '\b(krok|steps)'

# Treningi (brain/fitness.py, Zadania -> Treningi): the triathlon plan; done = Strava, work load = calendar + tasks.
training:
  race: { name: "1/2 Ironman", date: "2027-09-02", distance: half }   # date YYYY-MM-DD; sprint | olympic | half | full
  # A normal (build-phase) week, ~5 h; other phases scale the hours (base 85%, peak 110%, taper 50%, recovery 65%).
  weekly:
    swim: { sessions: 2, hours: 1.2 }    # technique + one longer continuous swim
    bike: { sessions: 2, hours: 2.3 }    # one long ride on the weekend + one quality / brick
    run: { sessions: 2, hours: 1.5 }     # one long easy run + one quality
    strength: { sessions: 2, hours: 0.7 }   # 2 x ~20 min (docs/triathlon-motor-prep.md); 1 x in the peak
  season_start: "2026-10-04"   # the first 6 weeks after it: general strength, then heavy lifting
  easy_share: 0.8          # 80/20
  easy_hr_max: 145         # average heart rate at or below = easy (top of Z2) - set your own
  weight_kg: null          # for workout kcal when Nutrition MCP has no weigh-in yet
  eat_back: 0.6            # share of the kcal burnt in training added to the day's goal (mostly carbs)
  steps_goal: 10000        # daily steps; benefits keep growing up to ~8-10k a day (Lancet Public Health 2022)
  work_categories: [SmartMeet, Praca]
  busy_week: { meeting_hours: 15, work_tasks_due: 8 }    # a work week this heavy -> 20-30% less training

voice:
  tts_enabled: true        # false -> Alfred answers without ElevenLabs (browser voice); listening (STT) unaffected
  stt_model: scribe_v2
  tts_model: eleven_flash_v2_5     # fast; eleven_multilingual_v2 = slower but more natural
  output_format: mp3_44100_128
  settings:
    speed: 1.2               # ElevenLabs allows 0.7-1.2

memory:
  dir: data/memory
  session_idle_minutes: 15
  recall_sessions: 3

proactive:
  enabled: true
  quiet_hours: ["23:00", "07:00"]
  routines: config/routines.yaml
  # Przypomnienia o zadaniach z terminem: Alfred odzywa się `lead_minutes` przed terminem (0 = dopiero o czasie)
  # i - przy fastest_path - proponuje najszybszą drogę do zrobienia zadania (pierwszy krok, co pominąć).
  reminders:
    lead_minutes: 15
    fastest_path: true

# Cele → „Rutyna produktywności” (Justin Sung, „Productivity is Hard Until You Build Systems Like This”):
# włączenie kopiuje te rutyny do config/routines.yaml (potem edytujesz je w Przeglądzie), wyłączenie je usuwa.
# 1) produktywność = to, co przybliża do Twoich 2-3 celów, 2) flow matching: zadania głębokie w szczycie energii,
# administracyjne gdy spada, 3) scripted actions „jeśli X, to Y” dla ryzykownych zadań, 4) wyzwalacze (cues),
# 5) regeneracja. Raz w tygodniu ~30 min planowania ustawia cały tydzień.
productivity:
  # slot = the time from his plan (Cele → Rutyna produktywności): peak, shallow, weekly, close, training; no slot =
  # schedule as is.
  # Each prompt gets his plan appended (brain/app.py productivity_routines).
  routines:
    - id: prod-plan-tygodnia
      slot: weekly
      schedule: "0 19 * * 0"
      module: tasks
      prompt: >-
        Rutyna produktywności - cotygodniowe planowanie. Przejrzyj moje cele i otwarte zadania na najbliższy
        tydzień. Odrzuć albo odłóż to, co nie przybliża mnie do moich 2-3 najważniejszych celów. Oceń każde zadanie:
        głębokie (wymaga skupienia) czy płytkie (admin). Zaproponuj plan: głębokie zadania w szczycie energii,
        płytkie po południu, w limicie godzin z mojego planu. Wskaż zadania ryzykowne (np. trening wieczorem) i dla
        każdego zaproponuj „jeśli X, to Y” oraz jeden wyzwalacz w otoczeniu, który ułatwi start; zapisz je jako notatkę
        w zadaniu. Ustaw terminy po mojej zgodzie i powiedz krótko, jak wygląda tydzień. Zaplanuj też treningi na
        tydzień (training_status: faza i realizacja planu): poza szczytem energii, o mojej porze treningu albo w
        weekend; przy ciężkim tygodniu w pracy zetnij objętość o 20-30%, zostaw jedną jednostkę jakościową.
    - id: prod-priorytety-dnia
      schedule: "30 7 * * 1-5"
      module: tasks
      prompt: >-
        Rutyna produktywności - priorytety dnia. Na podstawie moich celów, terminów i kalendarza zaproponuj kolejność
        dzisiejszych zadań: 1-3 głębokie na szczyt energii, płytkie i admin na popołudnie, a dzisiejszy trening z planu
        o mojej porze treningu. Dla najważniejszego podaj najszybszą drogę do zrobienia go i pierwszy krok na 5 minut.
        Jeśli dziś nie zapisałem wagi, zapytaj krótko o poranną wagę na czczo. Zmieniaj zadania tylko po mojej zgodzie.
    - id: prod-trening-dnia
      slot: training
      schedule: "30 17 * * 1-5"
      module: training
      prompt: >-
        Rutyna produktywności - pora treningu. Sprawdź w training_status i w zadaniach, co mam dziś trenować, i
        przypomnij jednym zdaniem: dyscyplina, czas, spokojnie czy jakościowo. Jeśli dzień w pracy był ciężki
        (kalendarz), zaproponuj lżejszą wersję jako „jeśli X, to Y”. Jeśli dziś trening jest już w Stravie albo nic
        nie zaplanowano, zamilcz.
    - id: prod-szczyt-energii
      slot: peak
      schedule: "0 9 * * 1-5"
      module: tasks
      prompt: >-
        Rutyna produktywności - szczyt energii. Przypomnij mi krótko, które głębokie zadanie robię teraz, jaki jest
        pierwszy krok i jaki rozpraszacz usunąć (telefon, powiadomienia). Jeśli nic głębokiego nie jest otwarte, zamilcz.
    - id: prod-blok-admin
      slot: shallow
      schedule: "0 14 * * 1-5"
      module: tasks
      prompt: >-
        Rutyna produktywności - blok płytkich zadań. Energia spada: wymień 2-4 drobne zadania (maile, faktury,
        telefony), które zrobię hurtem w godzinę, w kolejności od najszybszego. Jeśli nie ma żadnych, zamilcz.
    - id: prod-regeneracja
      slot: close
      schedule: "30 18 * * 1-5"
      module: tasks
      prompt: >-
        Rutyna produktywności - domknięcie dnia i regeneracja. Powiedz w jednym-dwóch zdaniach, co dziś zrobiłem,
        co przechodzi na jutro i jaki „jeśli X, to Y” mam na wieczór. Sprawdź dzisiejsze posiłki (get_goal_progress)
        i trening: jeśli brakuje posiłków, zapytaj, co jadłem; powiedz jednym zdaniem, jak wyszły kalorie i białko
        względem celu. Jeśli nie podałem dziś kroków, zapytaj, ile ich zrobiłem, i zapisz je (steps_log) - mam cel
        krokowy. Przypomnij o przerwie od ekranu - odpoczynek też przybliża mnie do celów.

# USD, for the cost split in the UI (Claude / Jev / ElevenLabs). Public list prices, 2026-09 - adjust to your plan.
prices:
  jev_input_per_mtok: 0.042            # typesafe.ai Jev: input tokens only, output is free (early access)
  elevenlabs_tts_per_1k_chars: 0.10    # Multilingual v2/v3 (Flash/Turbo: 0.05)
  elevenlabs_stt_per_hour: 0.22        # Scribe v2

logging:
  dir: data/logs

mcp_config: config/mcp.json
