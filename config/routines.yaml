    na telefonie; Ból głowy i szczęki; NIe robienie tasków od razu tylko odkładanie
    na później..'
  module: tasks
- id: prod-blok-admin
  schedule: 0 14 * * 1-5
  prompt: 'Rutyna produktywności - blok płytkich zadań. Energia spada: wymień 2-4
    drobne zadania (maile, faktury, telefony), które zrobię hurtem w godzinę, w kolejności
    od najszybszego. Jeśli nie ma żadnych, zamilcz. Mój plan: szczyt energii 10:00-13:00.
    płytkie zadania od 14:00. najwyżej 100 h pracy w tygodniu. jeśli-to: Jeżeli będzie
    mnie bolała szczęka, to muszę odpuścić zadania w których musze myśleć. Nie jestem
