routines:
- id: poranny-brief
  schedule: 0 8 * * *
  module: calendar
  prompt: Daj mi poranny brief na dziś - co mam w kalendarzu i jakie zadania są otwarte.
- id: powitanie
  schedule: '@start'
  prompt: Przywitaj mnie krótko i powiedz, co się wydarzyło od ostatniej sesji i co
    jest otwarte.
  min_idle_minutes: 60
  welcome_back: true
- id: prod-plan-tygodnia
  schedule: 0 21 * * 0
  prompt: 'Rutyna produktywności - cotygodniowe planowanie. Przejrzyj moje cele i
    otwarte zadania na najbliższy tydzień. Odrzuć albo odłóż to, co nie przybliża
    mnie do moich 2-3 najważniejszych celów. Oceń każde zadanie: głębokie (wymaga
    skupienia) czy płytkie (admin). Zaproponuj plan: głębokie zadania w szczycie energii,
    płytkie po południu, w limicie godzin z mojego planu. Wskaż zadania ryzykowne
    (np. trening wieczorem) i dla każdego zaproponuj „jeśli X, to Y” oraz jeden wyzwalacz
    w otoczeniu, który ułatwi start; zapisz je jako notatkę w zadaniu. Ustaw terminy
    po mojej zgodzie i powiedz krótko, jak wygląda tydzień. Mój plan: szczyt energii
    10:00-13:00. płytkie zadania od 14:00. najwyżej 100 h pracy w tygodniu. jeśli-to:
    Jeżeli będzie mnie bolała szczęka, to muszę odpuścić zadania w których musze myśleć.
    Nie jestem wtedy wstanie ogarniać nic merytorycznego.  Powinienem się skupić na
    takich rzeczach jak relax, nagrywanie rolek, granie, wykonywanie treningów itd.
    W zależności od tego co jest do zrobienia w tygodniu.. wyzwalacze: Alfred, przypominający
    mi o taskach i celach.; Notowanie w moim notesie; Treningni sprawiają, że jestem
    bardziej prodtywny. rozpraszacze: YouTube; Przeglądanie rolek na telefonie; Ból
    głowy i szczęki; NIe robienie tasków od razu tylko odkładanie na później..'
  module: tasks
- id: prod-priorytety-dnia
  schedule: 30 7 * * *
  prompt: 'Rutyna produktywności - priorytety dnia. Na podstawie moich celów, terminów
    i kalendarza zaproponuj kolejność dzisiejszych zadań: 1-3 głębokie na szczyt energii,
    płytkie i admin na popołudnie. Dla najważniejszego podaj najszybszą drogę do zrobienia
    go i pierwszy krok na 5 minut. Zmieniaj zadania tylko po mojej zgodzie. Mój plan:
    szczyt energii 10:00-13:00. płytkie zadania od 14:00. najwyżej 100 h pracy w tygodniu.
    jeśli-to: Jeżeli będzie mnie bolała szczęka, to muszę odpuścić zadania w których
    musze myśleć. Nie jestem wtedy wstanie ogarniać nic merytorycznego.  Powinienem
    się skupić na takich rzeczach jak relax, nagrywanie rolek, granie, wykonywanie
    treningów itd. W zależności od tego co jest do zrobienia w tygodniu.. wyzwalacze:
    Alfred, przypominający mi o taskach i celach.; Notowanie w moim notesie; Treningni
    sprawiają, że jestem bardziej prodtywny. rozpraszacze: YouTube; Przeglądanie rolek
    na telefonie; Ból głowy i szczęki; NIe robienie tasków od razu tylko odkładanie
    na później..'
  module: tasks
- id: prod-szczyt-energii
  schedule: 0 10 * * 1-5
  prompt: 'Rutyna produktywności - szczyt energii. Przypomnij mi krótko, które głębokie
    zadanie robię teraz, jaki jest pierwszy krok i jaki rozpraszacz usunąć (telefon,
    powiadomienia). Jeśli nic głębokiego nie jest otwarte, zamilcz. Mój plan: szczyt
    energii 10:00-13:00. płytkie zadania od 14:00. najwyżej 100 h pracy w tygodniu.
    jeśli-to: Jeżeli będzie mnie bolała szczęka, to muszę odpuścić zadania w których
