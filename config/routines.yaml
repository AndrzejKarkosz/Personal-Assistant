  module: tasks
- id: prod-regeneracja
  schedule: 0 20 * * *
  prompt: 'Rutyna produktywności - domknięcie dnia i regeneracja. Powiedz w jednym-dwóch
    zdaniach, co dziś zrobiłem, co przechodzi na jutro i jaki „jeśli X, to Y” mam
    na wieczór. Przypomnij o przerwie od ekranu - odpoczynek też przybliża mnie do
    celów. Mój plan: szczyt energii 10:00-13:00. płytkie zadania od 14:00. najwyżej
    100 h pracy w tygodniu. jeśli-to: Jeżeli będzie mnie bolała szczęka, to muszę
